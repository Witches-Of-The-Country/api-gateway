spring.application.name=api-gateway
server.port=${PORT:9090}

# Downstream Service URLs
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8082}
character.service.url=${CHARACTER_SERVICE_URL:${PLAYER_CHARACTER_SERVICE_URL:http://localhost:8080}}

# Security & JWT Verification
jwt.secret=${JWT_SECRET:dungeoneer_default_development_secret_key_minimum_256_bits_length!}

# Centralized CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-User-Id}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

# Centralized Swagger UI / OpenAPI Configuration
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.urls[0].name=Player Character Service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/characters
springdoc.swagger-ui.urls[1].name=Auth Service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/auth

